name: Build 261107 study PDFs

on:
  push:
    paths:
      - 'weekly/261107/*.md'
      - '.github/workflows/build-261107-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Korean fonts and PDF converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --quiet markdown weasyprint

      - name: Generate study PDFs from the Markdown sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape
          import markdown
          from weasyprint import HTML

          base = Path("weekly/261107")
          css = """
          @page { size: A4; margin: 18mm 17mm; }
          body { font-family: "Noto Sans CJK KR", "Noto Sans", sans-serif;
                 font-size: 10pt; line-height: 1.55; color: #192433; }
          h1 { font-size: 18pt; color: #18375b; line-height: 1.35; }
          h2 { font-size: 14pt; color: #18375b; margin-top: 18pt; border-bottom: 1px solid #bfd1e7; }
          h3 { font-size: 11pt; margin-top: 12pt; }
          p, li { orphans: 2; widows: 2; }
          table { width:100%; border-collapse: collapse; margin: 7pt 0; font-size: 8.8pt; }
          td, th { border: 0.6pt solid #b8c6d6; padding: 4pt 5pt; vertical-align: top; }
          th { background:#eff3f8; }
          pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#f4f6f8; padding:8pt; }
          code { font-family:monospace; font-size: 9pt; overflow-wrap:anywhere; }
          blockquote { padding:3pt 10pt; margin:6pt 0; border-left:3pt solid #bfd1e7; color:#41546d; }
          """
          for src in ("Questions.md", "Answers.md"):
              text = (base / src).read_text(encoding="utf-8")
              content = markdown.markdown(text, extensions=["tables", "fenced_code"])
              HTML(string=f'<html lang="ko"><meta charset="utf-8"><style>{css}</style><body>{content}</body></html>',
                   base_url=str(base.resolve())).write_pdf(str(base / (src[:-3] + ".pdf")))
              print(f"Wrote {base / (src[:-3] + '.pdf')}")
          PY

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly/261107/Questions.pdf weekly/261107/Answers.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish 261107 practice questions and answers as PDFs"
            git push
          fi
